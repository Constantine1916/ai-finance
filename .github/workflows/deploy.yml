# 推送到 main 后自动部署：先跑类型、lint 与单元测试，通过后经 SSH 在 VPS 上运行 deploy/deploy.sh
# 服务器上的部署密钥被限定为只能执行 deploy.sh（authorized_keys 的 command= 与 restrict），并用 flock 串行
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes npm@11.21.0 ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 配置 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: 在 VPS 上运行 deploy.sh
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        # 公网 SSH 常被暴力扫描占满 MaxStartups，sshd 会随机断开新连接；
        # 只对 ssh 自身的连接错误（退出码 255）重试，deploy.sh 失败时直接报错
        run: |
          for wait in 5 10 20 40 0; do
            status=0
            ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "root@$DEPLOY_HOST" || status=$?
            [ "$status" -ne 255 ] && exit "$status"
            [ "$wait" -eq 0 ] && break
            echo "SSH 连接失败，${wait} 秒后重试"
            sleep "$wait"
          done
          exit 255
