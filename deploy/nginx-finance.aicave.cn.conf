# finance.aicave.cn：ai-finance 看板（仅所有者登录使用）
# 安装：复制到 /etc/nginx/conf.d/ai-finance.conf，nginx -t 通过后 systemctl reload nginx
server {
    listen 80;
    listen [::]:80;
    server_name finance.aicave.cn;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name finance.aicave.cn;

    ssl_certificate /etc/nginx/ssl/finance.aicave.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/finance.aicave.cn/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 应用只在 TRUST_PROXY=true 时读取 X-Real-IP；这里用连接地址覆盖，客户端无法伪造
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_read_timeout 60s;
    }
}
