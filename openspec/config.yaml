schema: spec-driven

context: |
  Language: Chinese
  All artifacts must be written in Chinese.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Project: ai-finance, independent public repository; OpenStock is a limited
    reference (TradingView widget container, EDGAR access pattern).
  Stage: design review; no application implementation yet.
  Scope (phase 1, personal use): macro and liquidity dashboard, market breadth,
    cycle quadrant and transparent signal rules, event calendar (1A);
    AI hardware industry cycle, filing-based fundamentals, cyclical stock view (1B).
  Users: a single owner on a private deployment; no public registration.
  Data: timeliness first; release-driven ingestion after official publication;
    intraday snapshots marked provisional, confirmed by daily close;
    traceable sources; explicit missing, pending-review, stale and provisional
    states; no fabricated financial data; no composite scores or trading
    instructions.
  Sources: FRED API, US Treasury yield curve, BLS and BEA APIs, SEC EDGAR XBRL,
    Finnhub quotes, a daily adjusted price provider, TSMC monthly revenue,
    manual entries with mandatory source links.
  Stack (confirmed): Next.js App Router, TypeScript, PostgreSQL with Drizzle,
    ECharts, pm2 (web and worker) and cron on the owner's VPS behind Nginx,
    served on finance.aicave.cn. The AI universe is editable in the UI.

rules:
  proposal:
    - 区分用户已确认的需求与待审阅的技术默认方案。
    - 明确第一阶段不包含的功能。
  specs:
    - 每个 requirement 包含 SHALL 或 MUST 以及可验收的 WHEN/THEN 场景。
    - 覆盖未登录、数据缺失、待确认、过期、修订与来源受限的情况。
  design:
    - 说明来源、授权、采集频率、密钥与第三方版权数据的边界。
    - 不把 TradingView 嵌入能力描述为可提取的行情 API。
  tasks:
    - 未实现的任务保持未勾选；外部实测与模拟测试分别记录。
